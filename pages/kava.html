      ${sec('Характеристики', `<div class="kv-grid4e">${KAVA.STATS.map(s=>`<label class="kv-fe"><span>${s.short} <em>${s.name}</em></span>${numF('stats.' + s.key, p.stats[s.key], 'min="-5" max="12"')}<span class="kv-mini">бонус ${numF('bonus.' + s.key, p.bonus[s.key])}</span></label>`).join('')}</div>
        <div class="kv-grid4e"><label class="kv-fe"><span>СТК сейчас</span>${numF('stk', p.stk)}</label><label class="kv-fe"><span>макс. СТК ±</span>${numF('stkMaxMod', p.stkMaxMod)}</label>
        <label class="kv-fe"><span>МОБ ±</span>${numF('mobMod', p.mobMod)}</label><label class="kv-fe"><span>Удача ±</span>${numF('luckMod', p.luckMod)}</label>
        <label class="kv-fe"><span>кС</span>${sel('ks', Dice.STEPS.filter(x=>x >= 6).map(x=>[x, 'к' + x]), p.ks, 'data-num="1"')}</label><label class="kv-fe"><span>+ к росту кС</span>${numF('ksBonus', p.ksBonus)}</label>
        <label class="kv-fe"><span>травм вместо смерти</span>${numF('scars', p.scars, 'min="0"')}</label><label class="kv-fe"><span>военных походов</span>${numF('campaigns', p.campaigns, 'min="0"')}</label></div>
        <div class="kv-grid4e"><label class="kv-fe"><span>атаки стрелковым ±</span>${numF('atkRanged', p.atkRanged)}</label><label class="kv-fe"><span>рукопашные ±</span>${numF('atkMelee', p.atkMelee)}</label></div>`)}
      ${sec('Предыстория', ['culture:Культура', 'craft:Ремесло', 'craft2:Общее ремесло', 'awakening:Становление: пробуждение', 'ritual:Ритуал декомпрессии'].map(x=>{ const [k, l] = x.split(':'); return `<label class="kv-fe kv-wide"><span>${l}</span>${area(k, p[k], 2)}</label>`; }).join(''))}
      ${sec('Детали', `<label class="kv-fe kv-wide"><span>Облик</span>${area('look', p.look, 2)}</label><label class="kv-fe kv-wide"><span>Талисман</span>${area('talisman', p.talisman, 2)}</label>
        ${p.memories.map((m, i)=>`<label class="kv-fe kv-wide"><span>${i + 1}. ${esc(m.q)}</span>${area('memories.' + i + '.a', m.a, 2, 'Это Воспоминание')}</label>`).join('')}`)}
      ${sec('Особенности', `<label class="kv-fe kv-wide"><span>Аугментации <button type="button" class="kv-die" data-a="augment" title="Случайная аугментация (к66)">⚄</button></span>${area('augments', p.augments, 3)}</label>
        <label class="kv-fe kv-wide"><span>Репутация</span>${area('reputation', p.reputation, 2)}</label><label class="kv-fe kv-wide"><span>Заметки</span>${area('notes', p.notes, 3)}</label>`)}
      ${sec('Критические травмы', `${p.injuries.map(x=>`<div class="kv-li2">${field('injuries.' + x.id + '.text', x.text)}<button type="button" class="kv-x" data-a="del" data-list="injuries" data-id="${x.id}">✕</button></div>`).join('')}
        <button type="button" class="kv-btn kv-sm" data-a="add-injury">+ Травма</button>`)}
      ${sec('Оборудование', `<div class="kv-items-e">${p.items.map(it=>itemEdit(it, 'items')).join('')}</div>
        <div class="kv-row2"><select class="kv-cat" data-cat="p">${catalogP()}</select><button type="button" class="kv-btn kv-sm" data-a="add-cat" data-side="p">Добавить</button><button type="button" class="kv-btn kv-sm" data-a="add-item" data-side="p">+ Свой</button></div>
        <div class="kv-load-line">${L.sl} из ${KAVA.SLOTS} СЛ · нагрузка ${L.eff} — ${L.name}</div>`)}

  function mechEdit(){
    const m = p.mech, L = Pilot.mechLoad(p), S = Pilot.sensorOf(m);
    const opt = (rows)=>rows.map(r=>[r.key, r.name]);
    return `<div class="kv-col kv-col-m kv-edit" data-col="m">
      <div class="kv-head"><div class="kv-kicker">Катафракт · правка</div>${field('mech.name', m.name, 'class="kv-name-in" placeholder="Имя Катафракта"')}
        <div class="kv-row2"><button type="button" class="kv-btn kv-primary" data-a="wizard-m">Собрать по книге</button><button type="button" class="kv-btn" data-a="class-m">Готовый класс</button></div></div>
      ${sec('Конструкция', `<div class="kv-grid4e">
        <label class="kv-fe"><span>Каркас</span>${sel('mech.frame', opt(MECH.FRAMES), m.frame)}</label><label class="kv-fe"><span>Утроба</span>${sel('mech.womb', opt(MECH.WOMBS), m.womb)}</label>
        <label class="kv-fe"><span>Ядро</span>${sel('mech.core', MECH.CORES.map(c=>[c.key, `${c.name} (${c.alien})`]), m.core)}</label><label class="kv-fe"><span>Реактор</span>${sel('mech.reactor', MECH.REACTORS.map(r=>[r.key, `${r.name} (${r.sl} СЛ)`]), m.reactor)}</label>
        <label class="kv-fe"><span>Сенсоры</span>${sel('mech.sensors', MECH.SENSORS.map(s=>[s.key, `${s.name} +${s.bonus}`]), m.sensors)}</label><label class="kv-fe"><span>бонус Сенсоров (0 — по типу)</span>${numF('mech.sensorBonus', m.sensorBonus)}</label>
        <label class="kv-fe"><span>СТК сейчас</span>${numF('mech.stk', m.stk)}</label><label class="kv-fe"><span>макс. СТК</span>${numF('mech.stkMax', m.stkMax)}</label>
        <label class="kv-fe"><span>МОБ ±</span>${numF('mech.mobMod', m.mobMod)}</label><label class="kv-fe"><span>кР сейчас</span>${sel('mech.kr', Dice.STEPS.filter(x=>x >= 6).map(x=>[x, 'к' + x]), m.kr, 'data-num="1"')}</label></div>

      ${sec('Оборудование', `<div class="kv-items-e">${m.items.map(it=>itemEdit(it, 'mech.items')).join('') || '<div class="kv-empty">Пусто</div>'}</div>
        <div class="kv-row2"><select class="kv-cat" data-cat="m">${catalogM()}</select><button type="button" class="kv-btn kv-sm" data-a="add-cat" data-side="m">Добавить</button><button type="button" class="kv-btn kv-sm" data-a="add-item" data-side="m">+ Своё</button></div>
        <div class="kv-load-line">${L.sl} СЛ (реактор ${Pilot.reactorOf(m).sl}, сенсоры ${int(m.sensorSl) || S.sl}) · нагрузка ${L.eff} — ${L.name}</div>`)}
      ${sec('Критические повреждения', `${m.crits.map(x=>`<div class="kv-li2">${field('mech.crits.' + x.id + '.text', x.text)}<button type="button" class="kv-x" data-a="del" data-list="mech.crits" data-id="${x.id}">✕</button></div>`).join('')}
        <button type="button" class="kv-btn kv-sm" data-a="add-crit">+ Повреждение</button>`)}
      ${sec('Особенности и детали', ['quirk:Каприз', 'gifts:Дары Ядра', 'nodes:Узлы', 'origin:Происхождение', 'camo:Камуфляж', 'inside:Внутри Утробы', 'marks:Отметины', 'notes:Заметки']
        .map(x=>{ const [k, l] = x.split(':'); return `<label class="kv-fe kv-wide"><span>${l}</span>${area('mech.' + k, m[k], 2)}</label>`; }).join(''))}
    </div>`;
  }
  function itemEdit(it, list){
    const b = `${list}.${it.id}.`, mech = list==='mech.items';
    const kinds = mech ? [['weapon', 'Оружие'], ['module', 'Модуль'], ['consumable', 'Расходник']] : [['gear', 'Снаряжение'], ['armor', 'Доспех'], ['weapon', 'Оружие']];
    let extra = '';
    if(it.kind==='weapon') extra = `<label class="kv-mini">вред ${field(b + 'dmg', it.dmg || '', 'size="4"')}</label>
      <label class="kv-mini">дист. ${sel(b + 'range', Object.keys(KAVA.RANGES).map(r=>[r, r + ' ' + KAVA.RANGES[r]]), it.range || '>')}</label>
      ${mech ? `<label class="kv-mini">тип ${sel(b + 'type', Object.keys(MECH.WEAPON_TYPES).map(k=>[k, MECH.WEAPON_TYPES[k]]), it.type || 'kinetic', 'data-restruct="1"')}</label>`
        : `<label class="kv-mini">атака ${sel(b + 'stat', ['som', 'mot', 'kog'].map(k=>[k, statShort(k) + ' — ' + KAVA.STAT_FOR_ATTACK[k]]), it.stat || 'mot')}</label>`}
      <label class="kv-mini kv-grow2">метки ${field(b + 'tags', it.tags || '', 'placeholder="Лёгкое, Каскад, Кластер/6…"')}</label>`;
    if(it.kind==='armor') extra = `<label class="kv-mini">МОБ + ${numF(b + 'mob', it.mob || 0)}</label><label class="kv-mini">кВ брони ${field(b + 'armor', it.armor || '', 'size="4" placeholder="к6"')}</label>
      <label class="kv-chk"><input type="checkbox" data-f="${b}worn"${it.worn ? ' checked' : ''}> надет</label>`;
    if(it.kind==='consumable') extra = `<label class="kv-mini">вид ${sel(b + 'ckey', MECH.CONSUMABLES.map(c=>[c.ckey, c.name]), it.ckey || 'ammo')}</label>`;
    if(it.kind==='module') extra = `<label class="kv-chk"><input type="checkbox" data-f="${b}off"${it.off ? ' checked' : ''}> отключён</label>${it.shield ? `<label class="kv-chk"><input type="checkbox" data-f="${b}used"${it.used ? ' checked' : ''}> щит использован</label>` : ''}`;
    return `<div class="kv-item-e kind-${it.kind}"><div class="kv-row2">${field(b + 'name', it.name, 'class="kv-grow2" placeholder="Название"')}
      ${sel(b + 'kind', kinds, it.kind, 'data-restruct="1"')}<label class="kv-mini">СЛ ${numF(b + 'sl', it.sl, 'min="0" max="12"')}</label>
      <button type="button" class="kv-x" data-a="del" data-list="${list}" data-id="${it.id}" title="Убрать">✕</button></div>

  }
  const og = (label, list, key)=>`<optgroup label="${esc(label)}">${list.map((t, i)=>`<option value="${key}:${i}">${esc(t.name)}${t.dmg ? ` (${esc(t.dmg)})` : ''}${t.sl ? ` · ${t.sl} СЛ` : ''}</option>`).join('')}</optgroup>`;
  const gearList = ()=>Object.keys(KAVA.START_GEAR).map(k=>KAVA.START_GEAR[k]);
  const catalogP = ()=>'<option value="">— из книги —</option>' + og('Доспехи', KAVA.ARMOR, 'armor') + og('Стрелковое', KAVA.RANGED, 'ranged') + og('Холодное', KAVA.MELEE, 'melee') + og('Тяжёлое', KAVA.HEAVY, 'heavy') + og('Снаряжение', gearList(), 'gear') + og('Стартовый набор', KAVA.START_KIT, 'kit');
  const catalogM = ()=>'<option value="">— из книги —</option>' + og('Расходники', MECH.CONSUMABLES, 'cons') + og('Кинетическое', MECH.KINETIC, 'kin') + og('Ракетное', MECH.MISSILES, 'mis') + og('Лучевое', MECH.BEAMS, 'beam') + og('Ближний бой', MECH.MELEE, 'mel') + og('Реликтовое (приложение 1)', LORE.RELIC_RANGED.concat(LORE.RELIC_MELEE), 'relic') + og('Модули', MECH.MODULES, 'mod');
  function fromCatalog(v){
    const [k, i] = String(v).split(':');
    const src = {armor:KAVA.ARMOR, ranged:KAVA.RANGED, melee:KAVA.MELEE, heavy:KAVA.HEAVY, gear:gearList(), kit:KAVA.START_KIT,
      cons:MECH.CONSUMABLES, kin:MECH.KINETIC, mis:MECH.MISSILES, beam:MECH.BEAMS, mel:MECH.MELEE, mod:MECH.MODULES, relic:LORE.RELIC_RANGED.concat(LORE.RELIC_MELEE)}[k];
    const t = src && src[+i]; if(!t) return null;
    return ['armor', 'ranged', 'melee', 'heavy', 'gear', 'kit'].includes(k) ? Pilot.itemFrom(t) : Pilot.mechItemFrom(t);
  }

  // ---------- отрисовка ----------
  function render(pilot){
    p = pilot || p; if(!root || !p) return;
    const keepY = window.scrollY, edit = mode==='edit';
    root.className = 'kv-tandem' + (edit ? ' is-edit' : '') + (p.inWomb ? ' in-womb' : '');
    root.innerHTML = (edit ? pilotEdit() : pilotPlay()) + spine() + (edit ? mechEdit() : mechPlay());
    window.scrollTo(0, keepY);
    if(typeof App!=='undefined') App.refresh();
  }
  function derived(){
    if(!root || !p) return;
    KAVA.STATS.forEach(s=>{ const el = root.querySelector(`[data-d="stat-${s.key}"]`); if(el) el.textContent = plus(Pilot.stat(p, s.key)); });
    const l = root.querySelector('[data-d="luck"]'); if(l) l.textContent = Pilot.luck(p);
  }
  // путь в модели: "stats.som", "items.<id>.name", "mech.items.<id>.dmg", "memories.2.a"
  function setPath(path, v){
    const parts = path.split('.'); let o = p;
    for(let i = 0; i < parts.length - 1; i++){ const k = parts[i]; o = Array.isArray(o) && !/^\d+$/.test(k) ? o.find(x=>x && x.id===k) : o[k]; if(o == null) return; }
    o[parts[parts.length - 1]] = v;
  }
  const saveSoon = ()=>{ clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ Pilot.save(); if(typeof Table!=='undefined') Table.pilotChanged(); }, 300); };
  function onField(e){
    const el = e.target.closest('[data-f]'); if(!el || !p) return;
    let v = el.type==='checkbox' ? el.checked : el.value;
    if(el.dataset.num) v = int(v);
    setPath(el.dataset.f, v);
    if(el.dataset.f==='name' || el.dataset.f==='mech.name') App.names();
    if(el.dataset.f.startsWith('mech.items.') && el.dataset.f.endsWith('.type')){ const it = p.mech.items.find(x=>x.id===el.dataset.f.split('.')[2]); if(it) it.stat = {kinetic:'mot', missile:'kog', beam:'kog', melee:'som'}[v]; }
    saveSoon();
    if(e.type==='change' && (el.dataset.restruct || el.tagName==='SELECT' || el.type==='checkbox')) render(); else derived();
  }
  function onClick(e){
    const fold = e.target.closest('summary'); if(fold){ const d = fold.parentNode; if(d.dataset.fold) setTimeout(()=>App.fold(d.dataset.fold, !d.open), 0); return; }
    const b = e.target.closest('[data-a]'); if(!b || !p) return;
    const a = b.dataset.a, id = b.dataset.id;

  function mount(el){ root = el; root.addEventListener('input', onField); root.addEventListener('change', onField); root.addEventListener('click', onClick); }
  function setMode(m){ mode = m==='edit' ? 'edit' : 'play'; render(); }
  return {mount, render, setMode, fromCatalog, get mode(){ return mode; }, get pilot(){ return p; }};
})();
/* ======================================================================
   КАВАЛЕРИЯ — ДЕЙСТВИЯ: всё, что запускается с листа (data-a). Короткие действия бросают сразу (проверка

   Сложность и режим к20 (преимущество/препятствие) берутся из панели над листом; режим действует на один бросок.

const Actions = (function(){

      <div class="kv-sheet-grid">${UI.stepper('mob', tSel ? tMob(tg.find(t=>t.id===tSel)) : lastMob, 0, 40, 'МОБ цели')}${UI.stepper('extra', 0, -20, 20, 'Доп. бонус')}</div>
      ${modeChips()}

        ${usesKr ? UI.chip('kr', `+ кР к атаке (к${p.mech.kr})`, false, (w.type==='beam' ? 'Энерговооружение' : 'Удар') + ': бросок кР — бонус к атаке; кР растёт, 7+ — перегрев') : ''}
        ${w.range!=='⁕' ? UI.chip('contact', 'Цель вплотную (⁕)', false, 'Стрельба вплотную не Лёгким оружием — с препятствием') : ''}

        <button type="button" class="kv-btn kv-primary kv-grow2" data-a="go" autofocus>Атаковать</button></div>`,
      onInput(panel){
        const sel = panel.querySelector('[name=target]'); if(!sel || sel.dataset.v===sel.value) return; sel.dataset.v = sel.value;
        const t = tg.find(x=>x.id===sel.value), info = panel.querySelector('[data-tinfo]'); if(info) info.textContent = tInfo(t);

          w.evo = (w.evo || []).concat(text); w.note = [String(w.note || '').split(' · Эволюция:')[0], 'Эволюция: ' + w.evo.join('; ')].join(' · '); Pilot.save();

      }});
  }
  function alienSheet(p, dive){
    UI.sheet({title:dive ? 'Выход из погружения' : 'Испытание Отчуждённости', sub:`к20 + ЭМП против Отчуждённости ${Pilot.coreOf(p.mech).alien}${dive ? ' + Измерение' : ''}`, html:`
      ${dive ? `<div class="kv-sheet-grid">${UI.stepper('depth', 1, 0, 20, 'Измерение')}</div>` : ''}${modeChips()}
      <div class="kv-sheet-btns"><button type="button" class="kv-btn kv-primary kv-grow2" data-a="go" autofocus>Бросить</button></div>`,
      onAction(a, btn, close, panel){ App.setMode('norm'); done(Rolls.alienation(p, dive ? UI.num(panel, 'depth', 0) : 0, pickMode(panel))); }});
  }
  // ---------- предметы ----------
  function itemSheet(p, side, id){
    const list = side==='m' ? p.mech.items : p.items, it = list.find(x=>x.id===id); if(!it) return;
    const cap = Rolls.itemCap(it);
    UI.sheet({title:it.name || 'Предмет', sub:`${int(it.sl)} СЛ${it.value ? ' · ' + it.value : ''}`, html:`
      ${it.text || it.note ? `<p class="kv-p">${esc(it.text || it.note)}</p>` : ''}
      ${it.kind==='armor' ? `<p class="kv-p">${it.mob ? `+${it.mob} МОБ. ` : ''}${it.armor ? `Броня ${esc(it.armor)} кВ: кости вычитаются из урона, каждая на 4+ теряет метку.` : ''}</p>` : ''}
      <div class="kv-fe kv-wide"><span>Метки расхода (${int(it.marks)} из ${cap})</span>${UI.dots(int(it.marks), cap, 'mark', it.id)}</div>
      <div class="kv-sheet-btns">${it.kind==='armor' ? `<button type="button" class="kv-btn" data-a="wear">${it.worn ? 'Снять' : 'Надеть'}</button>` : ''}
        <button type="button" class="kv-btn" data-a="fix">Восстановить метки</button><button type="button" class="kv-btn kv-primary kv-grow2" data-a="kv">Кость расхода к6</button></div>`,
      onAction(a, btn, close, panel){
        if(a==='kv'){ done(Rolls.kv(p, id, side==='m')); return; }
        if(a==='mark'){ const i = +btn.dataset.i; it.marks = int(it.marks)===i + 1 ? i : i + 1; }
        if(a==='fix') it.marks = 0;
        if(a==='wear') it.worn = !it.worn;
        Pilot.save(); Tandem.render(); itemSheet(p, side, id);
      }});
  }
  function moduleSheet(p, id){
    const it = p.mech.items.find(x=>x.id===id); if(!it) return;
    UI.sheet({title:it.name, sub:`Модуль · ${int(it.sl)} СЛ · ${it.value || ''}`, html:`<p class="kv-p">${esc(it.text || '')}</p>
      ${it.kv ? `<div class="kv-fe kv-wide"><span>Метки (${int(it.marks)} из 3)</span>${UI.dots(int(it.marks), 3, 'mark', it.id)}</div>` : ''}
      <div class="kv-sheet-btns"><button type="button" class="kv-btn" data-a="toggle">${it.off ? 'Включить обратно' : 'Отключён (повреждение, перегрев)'}</button>
        ${it.shield ? `<button type="button" class="kv-btn" data-a="shield">${it.used ? 'Щит восстановлен' : 'Щит использован'}</button>` : ''}
        ${it.kr || it.kv ? `<button type="button" class="kv-btn kv-primary kv-grow2" data-a="use">${it.kv ? 'Бросок к6 расходника' : 'Активировать (бросок кР)'}</button>` : ''}</div>`,
      onAction(a, btn){
        if(a==='use'){ done(Rolls.moduleUse(p, id)); return; }
        if(a==='mark'){ const i = +btn.dataset.i; it.marks = int(it.marks)===i + 1 ? i : i + 1; }
        if(a==='toggle') it.off = !it.off;
        if(a==='shield') it.used = !it.used;
        Pilot.save(); Tandem.render(); moduleSheet(p, id);
      }});
  }
  function consSheet(p, key){
    const c = MECH.CONSUMABLES.find(x=>x.ckey===key), list = Pilot.consumables(p, key);
    const act = key==='radiator' ? ['radiator', 'Снизить кР на степень'] : key==='repair' ? ['repair', 'Ремкассеты: +к6 СТК'] : null;
    UI.sheet({title:c.name, sub:'Кость расхода к6 с тремя метками, метка — на 4+', html:`<p class="kv-p">${esc(c.text)}</p>
      ${list.map((it, i)=>`<div class="kv-fe kv-wide"><span>Блок ${i + 1}</span>${UI.dots(int(it.marks), 3, 'mark', it.id)}</div>`).join('')}
      <div class="kv-sheet-btns"><button type="button" class="kv-btn" data-a="fix">Пополнить (1 Мат за кость)</button>${act ? `<button type="button" class="kv-btn kv-primary kv-grow2" data-a="${act[0]}">${act[1]}</button>` : ''}</div>`,
      onAction(a, btn){
        if(a==='radiator'){ done(Rolls.cool(p, false)); return; }
        if(a==='repair'){ done(Rolls.repairKit(p)); return; }
        if(a==='mark'){ const it = list.find(x=>x.id===btn.dataset.id); const i = +btn.dataset.i; it.marks = int(it.marks)===i + 1 ? i : i + 1; }
        if(a==='fix') list.forEach(it=>{ it.marks = 0; });
        Pilot.save(); Tandem.render(); consSheet(p, key);
      }});
  }
  // ---------- броски по таблицам ----------
  function tablesSheet(p){
    UI.sheet({title:'Броски', sub:'таблицы книги и свободный бросок', html:`
      <div class="kv-act-grid">
        <button type="button" class="kv-act" data-a="reaction"><b>Реакция</b><span>2к6</span></button>
        <button type="button" class="kv-act" data-a="fame"><b>Слава</b><span>к20 + походы против сложности</span></button>
        <button type="button" class="kv-act" data-a="init"><b>Инициатива</b><span>к6 лидера стороны</span></button>
        <button type="button" class="kv-act" data-a="crit"><b>Крит. травма</b><span>к20 по таблице</span></button>
        <button type="button" class="kv-act" data-a="mcrit"><b>Крит. повреждение</b><span>к20, в лист Катафракта</span></button>
      </div>
      <div class="kv-sheet-grid">${UI.stepper('morale', 7, 2, 12, 'Боевой дух')}<button type="button" class="kv-btn" data-a="morale">Проверка 2к6</button></div>
      <div class="kv-sheet-grid"><label class="kv-stepper"><span>Торги</span><select name="trade">${KAVA.TRADE.map(t=>`<option value="${t.key}">${t.name} (${t.dice})</option>`).join('')}</select></label>${UI.stepper('tmod', 0, -6, 6, '±')}<button type="button" class="kv-btn" data-a="trade">Торги</button></div>
      <div class="kv-sheet-grid">${UI.stepper('chance', 2, 1, 5, 'Шанс Х-з-6')}<button type="button" class="kv-btn" data-a="chance">Бросок шанса</button></div>
      <div class="kv-sheet-grid"><label class="kv-stepper kv-grow2"><span>Свободный бросок</span><input name="free" value="${esc(App.pref('free') || 'к20')}" placeholder="к20, 2к6+1, к66, к100"></label><button type="button" class="kv-btn kv-primary" data-a="free">Бросить</button></div>
      <div class="kv-chips2">${['к4', 'к6', 'к8', 'к10', 'к12', 'к20', 'к66', 'к100'].map(x=>`<button type="button" class="kv-chip" data-a="quick" data-f="${x}">${x}</button>`).join('')}</div>`,
      onAction(a, btn, close, panel){
        const r = {reaction:()=>Rolls.reaction(0), fame:()=>Rolls.fame(p, App.dc(), d20()), init:()=>Rolls.initiative(), crit:()=>Rolls.crit(p), mcrit:()=>Rolls.mechCrit(p),
          morale:()=>Rolls.morale(UI.num(panel, 'morale', 7)), trade:()=>Rolls.trade(panel.querySelector('[name=trade]').value, UI.num(panel, 'tmod', 0)),
          chance:()=>Rolls.chance(UI.num(panel, 'chance', 2)), free:()=>{ const f = panel.querySelector('[name=free]').value; App.pref('free', f); return Rolls.free(f); }, quick:()=>Rolls.free(btn.dataset.f)}[a];
        if(r) done(r());
      }});
  }

  // ---------- диспетчер data-a с листа ----------
  function handle(a, b, p){
    const id = b.dataset.id, toggleMark = (list)=>{ const it = list.find(x=>x.id===id); if(!it) return; const i = +b.dataset.i; it.marks = int(it.marks)===i + 1 ? i : i + 1; Pilot.save(); };
    switch(a){
      case 'check': done(Rolls.check(p, b.dataset.k, App.dc(), d20())); return;
      case 'luck': done(Rolls.luck(p, d20())); return;
      case 'ks': ksSheet(p); return;
      case 'kr': krSheet(p); return;
      case 'p-stk': p.stk = int(p.stk) + int(b.dataset.d); Pilot.save(); if(typeof Table!=='undefined') Table.pilotChanged(); return 'render';
      case 'm-stk': p.mech.stk = Math.max(0, int(p.mech.stk) + int(b.dataset.d)); Pilot.save(); if(typeof Table!=='undefined') Table.pilotChanged(); return 'render';
      case 'p-hurt': hurtSheet(p, 'p'); return;
      case 'm-hurt': hurtSheet(p, 'm'); return;
      case 'p-weapon': attackSheet(p, 'p', id); return;
      case 'm-weapon': attackSheet(p, 'm', id); return;
      case 'p-item': itemSheet(p, 'p', id); return;
      case 'p-kv': done(Rolls.kv(p, id)); return;
      case 'p-mark': toggleMark(p.items); return 'render';
      case 'm-mark': toggleMark(p.mech.items); return 'render';
      case 'm-module': moduleSheet(p, id); return;
      case 'm-use': done(Rolls.moduleUse(p, id)); return;
      case 'm-cons': consSheet(p, b.dataset.k); return;
      case 'm-frame': done(Rolls.frameAbility(p)); return;
      case 'm-sensors': done(Rolls.sensors(p, App.dc(), d20())); return;
      case 'm-alien': alienSheet(p, false); return;
      case 'm-dive': alienSheet(p, true); return;
      case 'm-divesheet': Dive.sheet(p); return;
      case 'scar': done(Rolls.scar(p)); return;
      case 'mem': { const m = p.memories[+b.dataset.i]; if(m){ m.lost = !m.lost; Pilot.save(); } return 'render'; }
      case 'wizard-p': Wizard.pilot(p); return;
      case 'wizard-m': Wizard.mech(p); return;
      case 'class-m': Wizard.classes(p); return;
      case 'augment': { const x = Create.augment(); x.apply(p); Pilot.save(); done(Rolls.push({who:p.name, kind:'create', title:'Аугментация', tone:'info', big:'к66', verdict:x.summary, lines:x.lines, dice:x.dice})); return; }
      case 'add-injury': p.injuries.push({id:Pilot.uid(), text:''}); Pilot.save(); return 'render';
      case 'add-crit': p.mech.crits.push({id:Pilot.uid(), text:''}); Pilot.save(); return 'render';
      case 'add-item': (b.dataset.side==='m' ? p.mech.items : p.items).push(b.dataset.side==='m' ? {id:Pilot.uid(), kind:'module', name:'', sl:1, marks:0} : {id:Pilot.uid(), kind:'gear', name:'', sl:1, marks:0}); Pilot.save(); return 'render';
      case 'add-cat': { const s = document.querySelector(`.kv-cat[data-cat="${b.dataset.side}"]`), it = s && Tandem.fromCatalog(s.value); if(it){ (b.dataset.side==='m' ? p.mech.items : p.items).push(it); Pilot.save(); } return 'render'; }
      case 'del': { const path = b.dataset.list.split('.'); let o = p; path.forEach(k=>{ o = o[k]; }); const i = o.findIndex(x=>x.id===id); if(i >= 0) o.splice(i, 1); Pilot.save(); return 'render'; }
      case 'sensor-mod': { const n = b.dataset.n, list = p.mech.sensorModules, i = list.indexOf(n); if(i >= 0) list.splice(i, 1); else list.push(n); Pilot.save(); return 'render'; }
    }
  }
  return {handle, done, tablesSheet, attackSheet, hurtSheet};
})();
/* ======================================================================
   КАВАЛЕРИЯ — МАСТЕР СОЗДАНИЯ ПО ШАГАМ КНИГИ. Спектр: 1 характеристики, 2 происхождение, 3 становление,
   4 экипировка, 5 итоговые параметры, 6 личность. Катафракт: путь (конструктор или готовый класс) → конструкция
   (каркас, утроба, ядро, реактор, сенсоры — каждый можно перебросить) → сенсорные модули → оборудование →
   особенности (каприз, имя, детали). Кости летят в 3D, результат остаётся на шаге; всё выпавшее — в журнал.
   Работает над черновиком: «Готово» записывает его в тандем (новый Спектр — новым тандемом).
   ====================================================================== */
const Wizard = (function(){
  const esc = kvEsc, int = (v, d)=>Pilot.int(v, d);
  let ov = null, st = null;
  const clone = (x)=>JSON.parse(JSON.stringify(x));
  function open(state){
    st = state; close(true);
    ov = document.createElement('div'); ov.className = 'kv-sheet-back kv-wiz-back';
    ov.innerHTML = '<div class="kv-sheet kv-wizard" role="dialog" aria-modal="true"></div>';
    document.body.appendChild(ov); requestAnimationFrame(()=>ov && ov.classList.add('show'));
    ov.addEventListener('click', onClick); ov.addEventListener('input', onInput);
    draw();
  }
  function close(silent){ if(!ov) return; const o = ov; ov = null; o.classList.remove('show'); setTimeout(()=>o.remove(), 180); if(!silent) st = null; }
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && ov && !UI.isOpen){ if(confirm('Закрыть мастер? Несохранённые шаги пропадут.')) close(); } });
  const log = (title, x)=>Rolls.push({who:st.draft.name || (st.kind==='m' ? 'Катафракт' : 'Спектр'), kind:'create', title, tone:'info', big:'', verdict:x.summary || '', lines:x.lines, dice:x.dice});
  // бросок шага: анимация, запись в черновик и журнал
  function rollStep(key, fn, title){
    const x = fn(); x.apply(st.draft); st.res[key] = x; log(title, x);
    draw();
    if(x.dice && x.dice.length) Dice3D.roll(x.dice.slice(0, 8), {dim:false}).then(t=>setTimeout(()=>Dice3D.clear(t), 900));
  }
  const res = (key)=>st.res[key] ? `<div class="kv-wiz-res">${st.res[key].lines.map(l=>`<div>${esc(l)}</div>`).join('')}</div>` : '';
  const rollBtn = (act, label, done)=>`<button type="button" class="kv-btn ${done ? '' : 'kv-primary'}" data-w="${act}">${done ? '⚄ Перебросить' : '⚄ ' + (label || 'Бросить')}</button>`;

  // ---------- Спектр ----------
  const P_STEPS = [
    {t:'Характеристики', body(){ const d = st.draft;
      return `<p class="kv-p">Начальное значение 0. Для каждой характеристики бросьте к6 три раза: +1 за каждую 4 или 5, +2 за 6.</p>
        ${rollBtn('stats', 'Бросить характеристики', st.res.stats)}${res('stats')}
        <div class="kv-wiz-stats">${KAVA.STATS.map(s=>`<label><b>${s.short}</b><em>${s.name}</em><input type="number" data-wf="stats.${s.key}" value="${int(d.stats[s.key])}"></label>`).join('')}</div>`; }},
    {t:'Происхождение', body(){ const d = st.draft;
      return `<p class="kv-p">Культура — 2к6, её Ремесло — к6, дополнительное Ремесло из Общих — к66. Культура или Ремесло дают успех без проверки в тривиальном для такого опыта деле или преимущество там, где опыт помогает.</p>
        ${rollBtn('culture', 'Бросить Культуру и Ремёсла', st.res.culture)}${res('culture')}
        <label class="kv-fe kv-wide"><span>Культура</span><textarea data-wf="culture" rows="2">${esc(d.culture)}</textarea></label>
        <label class="kv-fe kv-wide"><span>Ремесло</span><textarea data-wf="craft" rows="2">${esc(d.craft)}</textarea></label>
        <label class="kv-fe kv-wide"><span>Общее ремесло</span><textarea data-wf="craft2" rows="2">${esc(d.craft2)}</textarea></label>`; }},
    {t:'Становление', body(){ const d = st.draft;
      return `<p class="kv-p">Как персонаж стал Спектром — Пробуждение (к66) — и как он избавляется от Отдачи — Ритуал декомпрессии (к66).</p>
        ${rollBtn('becoming', 'Бросить Становление', st.res.becoming)}${res('becoming')}
        <label class="kv-fe kv-wide"><span>Пробуждение</span><textarea data-wf="awakening" rows="2">${esc(d.awakening)}</textarea></label>

    {t:'Экипировка', body(){ const g = st.gear;

        <div class="kv-sheet-grid">${UI.stepper('ga', g.a, 0, 6, 'Доспехи к6')}${UI.stepper('gw', g.w, 0, 6, 'Вооружение к6')}${UI.stepper('gg', g.g, 0, 6, 'Снаряжение к66')}</div>

        ${g.a + g.w + g.g===6 ? rollBtn('gear', 'Бросить экипировку', st.res.gear) : ''}${res('gear')}`; }},
    {t:'Параметры', body(){ const d = st.draft, m = Pilot.mob(d);
      return `<p class="kv-p">СТК = 6 + СОМ, МОБ = 10 + МОТ (доспехи и нагрузка учтены), Испытание Удачи — 13, кость синхронизации — к6.</p>
        <div class="kv-wiz-stats"><label><b>${Pilot.stkMax(d)}</b><em>СТК</em></label><label><b>${m.total}</b><em>МОБ</em></label><label><b>${Pilot.luck(d)}</b><em>Удача</em></label><label><b>к6</b><em>кС</em></label></div>
        <div class="kv-note">Нагрузка: ${Pilot.load(d).eff} — ${Pilot.load(d).name} (${Pilot.slotsUsed(d)} СЛ)</div>`; }},

        <label class="kv-fe kv-wide"><span>Талисман</span><textarea data-wf="talisman" rows="2">${esc(d.talisman)}</textarea></label>
        <p class="kv-p">Пять ответов — Воспоминания Спектра. Утратив все, он станет Опустошённым.</p>
        ${d.memories.map((m, i)=>`<label class="kv-fe kv-wide"><span>${i + 1}. ${esc(m.q)}</span><textarea data-wf="memories.${i}.a" rows="2">${esc(m.a)}</textarea></label>`).join('')}`; }}
  ];
  // ---------- Катафракт ----------
  const M_STEPS = [
    {t:'Путь', body(){ return `<p class="kv-p">Соберите новую машину бросками по таблицам — или возьмите готовый класс и продолжите с оборудования.</p>
      <div class="kv-act-grid"><button type="button" class="kv-act${st.path==='build' ? ' on' : ''}" data-w="path" data-v="build"><b>Конструктор</b><span>Каркас, Утроба, Ядро, Реактор, Сенсоры — броски к6</span></button>
      ${MECH.CLASSES.map((c, i)=>`<button type="button" class="kv-act${st.path==='c' + i ? ' on' : ''}" data-w="path" data-v="c${i}"><b>${esc(c.name)}</b><span>${esc(MECH.FRAMES.find(f=>f.key===c.frame).name)} · СТК ${c.stk} · ${esc(c.desc.split('.').slice(-2, -1)[0] || '')}</span></button>`).join('')}</div>`; }},
    {t:'Конструкция', skip:()=>st.path!=='build', body(){ const m = st.draft.mech, row = (k, l, val)=>`<div class="kv-wiz-row"><b>${l}</b><span>${esc(val)}</span><button type="button" class="kv-die" data-w="${k}" title="Перебросить">⚄</button></div>`;
      const f = Pilot.frameOf(m), c = Pilot.coreOf(m), R = Pilot.reactorOf(m), S = Pilot.sensorOf(m), W = Pilot.womb(m);
      return `<p class="kv-p">Каркас определяет МОБ и СТК, Утроба — что будет при её повреждении, Ядро — Отчуждённость и характер, Реактор — СЛ и особенности кР, Сенсоры — бонус и дополнительные модули.</p>
        ${rollBtn('all', 'Бросить всё', st.res.frame)}
        ${st.res.frame ? row('frame', 'Каркас', `${f.name}: МОБ ${f.mob}, СТК ${m.stkMax}${f.note ? '. ' + f.note : ''}`) + row('womb', 'Утроба', `${W.name}: ${W.text}`) + row('core', 'Ядро', `${c.name}, Отчуждённость ${c.alien}. ${m.nature}`)
          + row('reactor', 'Реактор', `${R.name}, ${R.sl} СЛ${R.note ? '. ' + R.note : ''}`) + row('sensors', 'Сенсоры', `${S.name} +${S.bonus}, ${S.sl} СЛ, ${S.range}`) : ''}`; }},

  function draw(){

  function onClick(e){
    if(e.target===ov){ return; }
    const stp = e.target.closest('[data-step]');
    if(stp){ const inp = stp.parentNode.querySelector('input'); inp.value = Math.max(0, Math.min(6, int(inp.value) + (+stp.dataset.step))); inp.dispatchEvent(new Event('input', {bubbles:true})); return; }
    const g = e.target.closest('[data-wg]'); if(g){ st.gender = g.dataset.wg; draw(); return; }

      case 'gear': rollStep('gear', ()=>Create.gear(st.gear.a, st.gear.w, st.gear.g), 'Экипировка'); return;
      case 'name': rollStep('name', ()=>Create.name(st.gender), 'Имя'); return;
      case 'look': rollStep('look', Create.look, 'Облик'); return;
      case 'talisman': rollStep('talisman', Create.talisman, 'Талисман'); return;
      case 'path':
        st.path = b.dataset.v;
        if(st.path==='build'){ d.mech = Object.assign(Pilot.blankMech(), {name:m.cls ? '' : m.name}); delete st.res.frame; }
        else { const c = MECH.CLASSES[+st.path.slice(1)]; Create.applyClass(d, c); st.res.frame = {lines:[c.desc], dice:[]}; }
        draw(); return;
      case 'all': { const parts = [Create.frame(), Create.womb(), Create.core(), Create.reactor(), Create.sensors()]; parts.forEach(x=>x.apply(d));
        const x = {lines:[].concat(...parts.map(q=>q.lines)), dice:[].concat(...parts.map(q=>q.dice)).slice(0, 8), summary:parts.map(q=>q.summary).join(' · ')};
        st.res.frame = x; log('Конструкция Катафракта', x); draw(); Dice3D.roll(x.dice, {dim:false}).then(t=>setTimeout(()=>Dice3D.clear(t), 900)); return; }
      case 'frame': case 'womb': case 'core': case 'reactor': case 'sensors': {
        const x = Create[a](); x.apply(d); log('Катафракт: ' + a, x); st.res.frame = st.res.frame || x; draw(); Dice3D.roll(x.dice, {dim:false}).then(t=>setTimeout(()=>Dice3D.clear(t), 900)); return; }
      case 'smod': { const n = b.dataset.v, l = m.sensorModules, i = l.indexOf(n); if(i >= 0) l.splice(i, 1); else l.push(n); draw(); return; }
      case 'add': { const s = ov.querySelector('[data-wsel]'), it = s && Tandem.fromCatalog(s.value); if(it){ m.items.push(it); draw(); } return; }
      case 'del': m.items = m.items.filter(x=>x.id!==b.dataset.id); draw(); return;
      case 'mname': rollStep('mname', Create.mechName, 'Имя Катафракта'); return;
      case 'quirk': rollStep('quirk', Create.quirk, 'Каприз'); return;
      case 'details': rollStep('details', Create.details, 'Детали Катафракта'); return;
    }
  }
  // ---------- точки входа ----------
  function pilot(p, opts){
    const fresh = !!(opts && opts.fresh), draft = fresh ? Pilot.starter() : clone(p);
    if(fresh) draft.id = Pilot.uid();
    let g = {a:2, w:2, g:2}; try{ const pr = JSON.parse(localStorage.getItem('reincarnator_kava_app_v1') || '{}'); if(pr.armor!=null) g = {a:int(pr.armor), w:int(pr.weapons), g:int(pr.gear)}; }catch(e){}
    open({kind:'p', i:0, draft, target:p, fresh, res:{}, gear:g, gender:'any'});
  }
  function mech(p){ const draft = clone(p); if(!draft.mech.built){ draft.mech = Pilot.blankMech(); } open({kind:'m', i:0, draft, target:p, res:{}, path:'build', allValues:false}); }
  function classes(p){ const draft = clone(p); draft.mech = Pilot.blankMech(); draft.mech.name = p.mech.name; Create.applyClass(draft, MECH.CLASSES[0]); open({kind:'m', i:0, draft, target:p, res:{frame:{lines:[MECH.CLASSES[0].desc], dice:[]}}, path:'c0', allValues:false}); }
  return {pilot, mech, classes};
})();
/* ======================================================================
   КАВАЛЕРИЯ — ЖУРНАЛ БРОСКОВ: справа на широком экране, вкладкой на телефоне. Запись — заголовок, крупное число,
   вердикт; подробности раскрываются по нажатию. Чужие броски за столом приходят сюда же (см. стол).
   ====================================================================== */
const Log = (function(){
  let root = null, filter = 'all';
  const esc = kvEsc;
  const time = (t)=>new Date(t).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  function entry(e){
    return `<details class="kv-entry tone-${e.tone || 'info'}${e.secret ? ' secret' : ''}"><summary><span class="kv-entry-big">${esc(e.big!=null && e.big!=='' ? e.big : '•')}</span>
      <span class="kv-entry-main"><b>${esc(e.title)}</b><span>${esc(e.verdict || '')}</span></span><span class="kv-entry-meta">${e.who ? esc(e.who) + '<br>' : ''}${time(e.t)}</span></summary>
      ${(e.lines || []).map(l=>`<div class="kv-entry-l">${esc(l)}</div>`).join('')}</details>`;
  }
  function render(){
    if(!root) return;
    const list = Rolls.log.slice(-120).reverse().filter(e=>filter==='all' || (filter==='me' ? !e.remote : e.remote));
    root.querySelector('.kv-log-list').innerHTML = list.map(entry).join('') || '<div class="kv-empty">Бросков пока не было</div>';
  }
  function mount(el){
    root = el;
    root.innerHTML = `<div class="kv-log-head"><b>Журнал</b><span class="kv-chips2" data-logf="1"><button type="button" class="kv-chip on" data-lf="all">все</button><button type="button" class="kv-chip" data-lf="me">мои</button><button type="button" class="kv-chip" data-lf="them">стол</button></span>
      <button type="button" class="kv-btn kv-sm" data-a="tables" title="Таблицы книги и свободный бросок">⚄ Броски</button><button type="button" class="kv-x" data-a="clear" title="Очистить журнал">🗑</button></div>
      <div class="kv-log-list" aria-live="polite"></div>`;
    root.addEventListener('click', (e)=>{
      const f = e.target.closest('[data-lf]'); if(f){ filter = f.dataset.lf; root.querySelectorAll('[data-lf]').forEach(x=>x.classList.toggle('on', x===f)); render(); return; }
      const b = e.target.closest('[data-a]'); if(!b) return;
      if(b.dataset.a==='clear' && confirm('Очистить журнал бросков в этом браузере?')) Rolls.clear();
      if(b.dataset.a==='tables') Actions.tablesSheet(Tandem.pilot);
    });
    Rolls.onLog(()=>render());
    render();
  }
  return {mount, render};
})();
/* ======================================================================
   КАВАЛЕРИЯ — СТОЛ. Ссылка стола — /kava/КОД; сервер держит столы Кавалерии отдельно (sys=kava). Летописец создаёт
   стол (ключ Мастера — в этом браузере, reincarnator_kava_gm_keys_v1), игроки входят по ссылке. Сессия
   переживает перезагрузку (reincarnator_kava_session_v1). Сообщения (сервер ставит from):
     hello {name, tandem}        — игрок пришёл (всем); Летописец отвечает ему gm-hello
     gm-hello {name, telemost, lance} — Летописец (сервер пропускает только от подтверждённого Мастера)
     tandem {pilot}              — лист игрока Летописцу (при изменениях, не чаще раза в 1,5 с)
     roll {entry}                — бросок всем (тайные броски Летописца не рассылаются)
     request {rid, kind, stat, dc, mode, note} — Летописец просит бросок; mods {mode} — преимущество/препятствие
     hurt {side, amount, pierce} — Летописец наносит урон; telemost {url}; lance {state} — Копьё
   Команды Летописца принимаются только от того, кто прислал gm-hello. Связь проверяется сигналом hb раз в 20 с.
   ====================================================================== */
const Table = (function(){
  const SKEY = 'reincarnator_kava_session_v1', GKEY = 'reincarnator_kava_gm_keys_v1';
  const S = {code:'', role:null, ws:null, myId:'', gmId:'', gmName:'', peers:{}, telemost:'', lance:null, status:'off'};
  const listeners = [];
  let retry = 2000, retryTimer = 0, hbTimer = 0, pushTimer = 0, hbMiss = 0;
  const codeFromUrl = ()=>{ const m = location.pathname.match(/^\/kava\/([a-z0-9]{4,16})\/?$/); return m ? m[1] : ''; };
  S.code = codeFromUrl();
  function cid(role){
    let id = ''; try{ id = localStorage.getItem('reincarnator_client_id') || ''; }catch(e){}
    if(!/^[a-zA-Z0-9_-]{8,64}$/.test(id)){ id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); try{ localStorage.setItem('reincarnator_client_id', id); }catch(e){} }
    return role==='gm' ? id + '-gm' : id;
  }
  function gmKey(code){
    let keys = {}; try{ keys = JSON.parse(localStorage.getItem(GKEY) || '{}') || {}; }catch(e){}
    if(!/^[a-zA-Z0-9]{16,64}$/.test(keys[code] || '')){ keys[code] = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()) + Date.now()).replace(/[^a-zA-Z0-9]/g, '').slice(0, 32).padEnd(16, '0'); try{ localStorage.setItem(GKEY, JSON.stringify(keys)); }catch(e){} }
    return keys[code];
  }
  const ownsTable = (code)=>{ try{ return !!(JSON.parse(localStorage.getItem(GKEY) || '{}') || {})[code]; }catch(e){ return false; } };
  function newCode(){ const abc = 'abcdefghjkmnpqrstuvwxyz23456789', r = crypto.getRandomValues(new Uint8Array(6)); return Array.from(r, x=>abc[x % abc.length]).join(''); }
  const link = ()=>location.origin + '/kava/' + S.code;
  const emit = ()=>listeners.forEach(f=>{ try{ f(S); }catch(e){ console.error(e); } });
  const onChange = (f)=>listeners.push(f);
  const me = ()=>Tandem.pilot;
  const myName = ()=>{ const p = me(); return S.role==='gm' ? (App.pref('gmName') || 'Летописец') : (p && p.name) || 'Спектр'; };
  function send(msg, to){ if(S.ws && S.ws.readyState===1){ if(to) msg.to = to; try{ S.ws.send(JSON.stringify(msg)); }catch(e){} } }

  function connect(role){
    if(!S.code) return;
    clearTimeout(retryTimer); stopHb();
    if(S.ws){ try{ S.ws.onclose = null; S.ws.close(); }catch(e){} }
    S.role = role; S.status = 'connecting'; emit();
    try{ localStorage.setItem(SKEY, JSON.stringify({code:S.code, role})); }catch(e){}
    const url = (location.protocol==='https:' ? 'wss://' : 'ws://') + location.host + '/?cid=' + encodeURIComponent(cid(role)) + '&sys=kava&room=' + S.code + (role==='gm' ? '&gmkey=' + gmKey(S.code) : '');
    let ws; try{ ws = new WebSocket(url); }catch(e){ S.status = 'off'; emit(); return; }
    S.ws = ws;
    ws.onmessage = (ev)=>{ let m; try{ m = JSON.parse(ev.data); }catch(e){ return; } if(m && typeof m==='object') onMsg(m); };
    ws.onclose = ()=>{
      stopHb();
      if(S.ws!==ws) return;
      if(ws._denied){ S.role = null; S.status = 'denied'; emit(); UI.toast('У этого стола уже есть Летописец в другом браузере', 'fail'); return; }
      if(!S.role){ S.status = 'off'; emit(); return; }
      S.status = 'reconnecting'; emit();
      retryTimer = setTimeout(()=>connect(S.role), retry); retry = Math.min(retry * 1.5, 10000);
    };
  }
  function leave(){
    S.role = null; clearTimeout(retryTimer); stopHb();
    if(S.ws){ try{ S.ws.close(); }catch(e){} } S.ws = null; S.status = 'off'; S.peers = {}; S.gmId = '';
    try{ localStorage.removeItem(SKEY); }catch(e){}
    emit();
  }
  function startHb(){ stopHb(); hbMiss = 0; hbTimer = setInterval(()=>{ if(++hbMiss > 2 && S.ws){ try{ S.ws.close(); }catch(e){} return; } send({type:'hb'}); }, 20000); }
  function stopHb(){ clearInterval(hbTimer); hbTimer = 0; }
  const fromGm = (m)=>S.gmId && m.from===S.gmId;

  function onMsg(m){
    if(m.type==='hb-ack'){ hbMiss = 0; return; }
    if(m.type==='gm-denied'){ if(S.ws) S.ws._denied = true; return; }
    if(m.type==='welcome'){
      S.myId = m.id; S.status = 'on'; retry = 2000; startHb();
      if(S.role==='gm'){ S.gmId = m.id; send({type:'gm-hello', name:myName(), telemost:S.telemost, lance:S.lance}); if(typeof Battle!=='undefined') setTimeout(()=>Battle.sync(), 0); }
      else send({type:'hello', name:myName(), tandem:me()});
      emit(); return;
    }
    if(m.type==='replaced'){ UI.toast('Стол открыт в другой вкладке этого браузера', 'fail'); S.role = null; return; }
    const from = m.from;
    switch(m.type){
      case 'gm-hello':
        S.gmId = from; S.gmName = m.name || 'Летописец'; S.telemost = m.telemost || ''; if(m.lance) S.lance = m.lance;
        S.peers[from] = Object.assign(S.peers[from] || {}, {name:S.gmName, role:'gm', seen:Date.now()});
        if(S.role==='player') send({type:'tandem', pilot:me()}, from);
        emit(); break;
      case 'hello':
        S.peers[from] = Object.assign(S.peers[from] || {}, {name:m.name, role:'player', pilot:m.tandem || null, seen:Date.now()});
        if(S.role==='gm'){ send({type:'gm-hello', name:myName(), telemost:S.telemost, lance:S.lance}, from); if(typeof Battle!=='undefined') Battle.sync(from); }
        if(S.role==='gm') UI.toast(`${m.name || 'Игрок'} за столом`, 'ok');
        emit(); break;
      case 'tandem':
        S.peers[from] = Object.assign(S.peers[from] || {role:'player'}, {pilot:m.pilot, name:(m.pilot && m.pilot.name) || (S.peers[from] || {}).name, seen:Date.now()});
        emit(); break;
      case 'roll': if(m.entry){ const e = Object.assign({}, m.entry, {remote:true}); Rolls.push(e); if(S.peers[from]){ S.peers[from].last = e; emit(); } if(!e.secret){ UI.toast(`${e.who || 'Игрок'}: ${e.title} — ${e.big!=null ? e.big + ' · ' : ''}${e.verdict || ''}`, e.tone); if(typeof Epic!=='undefined' && Epic.kindOf(e)) Epic.play(e); } } break;
      case 'request': if(fromGm(m) && S.role==='player') Prompts.request(m); break;
      case 'mods': if(fromGm(m) && S.role==='player'){ App.setMode(m.mode || 'norm'); UI.toast(m.mode==='adv' ? 'Летописец: следующий бросок к20 с преимуществом' : m.mode==='dis' ? 'Летописец: следующий бросок к20 с препятствием' : 'Летописец снял преимущество/препятствие', m.mode==='dis' ? 'fail' : 'ok'); } break;
      case 'hurt': if(fromGm(m) && S.role==='player') Prompts.hurt(m); break;
      case 'telemost': if(fromGm(m)){ S.telemost = m.url || ''; emit(); if(S.telemost) UI.toast('Летописец добавил ссылку на Телемост', 'ok'); } break;
      case 'lance': if(fromGm(m)){ S.lance = m.state || null; emit(); } break;
      case 'battle': if(fromGm(m)) Battle.receive(m.state); break;
      case 'battle-move': if(S.role==='gm') Battle.onMove(from, m); break;
      case 'battle-hit': if(S.role==='gm') Battle.onHit(from, m); break;
      case 'peer-left': delete S.peers[m.id]; if(m.id===S.gmId && S.role==='player'){ S.gmId = ''; UI.toast('Летописец отключился', 'fail'); } emit(); break;
    }
  }
  // ---- API для страницы ----
  function rolled(e){ if(!e || !S.role || e.secret) return; send({type:'roll', entry:Object.assign({}, e, {remote:undefined})}); }
  function pilotChanged(){
    if(S.role!=='player' || !S.gmId) return;
    clearTimeout(pushTimer); pushTimer = setTimeout(()=>send({type:'tandem', pilot:me()}, S.gmId), 1500);
  }
  function setTelemost(url){ S.telemost = url; if(S.role==='gm') send({type:'telemost', url}); emit(); }
  function setLance(state){ S.lance = state; if(S.role==='gm') send({type:'lance', state}); emit(); }
  function create(){ S.code = newCode(); try{ history.replaceState(null, '', '/kava/' + S.code); }catch(e){} connect('gm'); }
  function joinCode(t){
    const m = String(t || '').trim().toLowerCase().match(/(?:\/kava\/)?([a-z0-9]{4,16})\/?(?:[?#].*)?$/);
    if(!m){ UI.toast('Не похоже на ссылку стола Кавалерии', 'fail'); return; }
    if(/\/rein\//.test(t) || (/^https?:/.test(t) && !/\/kava\//.test(t))){ if(confirm('Это ссылка на стол другой системы. Перейти туда?')) location.href = String(t).trim(); return; }
    S.code = m[1]; try{ history.replaceState(null, '', '/kava/' + S.code); }catch(e){} connect('player');
  }
  function init(){
    let saved = null; try{ saved = JSON.parse(localStorage.getItem(SKEY) || 'null'); }catch(e){}
    if(saved && saved.role && (!S.code || saved.code===S.code)){ S.code = saved.code; try{ history.replaceState(null, '', '/kava/' + S.code); }catch(e){} connect(saved.role); }
    else if(S.code && ownsTable(S.code)) connect('gm');
    else if(S.code) setTimeout(()=>TableUI.joinPrompt(), 300);
    emit();
  }
  return {init, connect, leave, create, joinCode, rolled, pilotChanged, send, setTelemost, setLance, onChange, link, ownsTable, get S(){ return S; },
    get isGm(){ return S.role==='gm'; }, get on(){ return S.status==='on'; }};
})();

/* ---------- подсказки игроку: запрос броска и урон от Летописца ---------- */
const Prompts = (function(){
  const esc = kvEsc;
  const KINDS = {check:'Проверка', luck:'Испытание Удачи', sensors:'Проверка Сенсоров', alien:'Испытание Отчуждённости', connect:'Подключение (кС)', backlash:'Отдача', init:'Инициатива'};
  function request(m){
    const p = Tandem.pilot, s = KAVA.STATS.find(x=>x.key===m.stat);
    const what = m.kind==='check' && s ? `Проверка ${s.short}` : KINDS[m.kind] || 'Бросок';
    if(m.mode) App.setMode(m.mode);
    UI.sheet({title:'Летописец просит бросок', sub:what + (m.dc ? ` · сложность ${m.dc}` : '') + (m.mode==='adv' ? ' · с преимуществом' : m.mode==='dis' ? ' · с препятствием' : ''), cls:'kv-sheet-request',
      html:`${m.note ? `<p class="kv-p">${esc(m.note)}</p>` : ''}<div class="kv-sheet-btns"><button type="button" class="kv-btn" data-a="close">Позже</button><button type="button" class="kv-btn kv-primary kv-grow2" data-a="go" autofocus>Бросить: ${esc(what)}</button></div>`,
      onAction(a){
        const mode = App.useMode(), dc = Pilot.int(m.dc, App.dc());
        let e = null;
        if(m.kind==='check') e = Rolls.check(p, m.stat || 'som', dc, mode);
        else if(m.kind==='luck') e = Rolls.luck(p, mode);
        else if(m.kind==='sensors') e = Rolls.sensors(p, dc, mode);
        else if(m.kind==='alien') e = Rolls.alienation(p, 0, mode);
        else if(m.kind==='connect') e = Rolls.connect(p);
        else if(m.kind==='backlash') e = Rolls.backlash(p, Pilot.int(m.overtime));
        else if(m.kind==='init') e = Rolls.initiative(p.name);
        if(e){ e.request = m.rid; Actions.done(e); }
      }});
  }
  function hurt(m){
    const mech = m.side==='m';
    UI.toast(`Летописец: ${m.amount} урона по ${mech ? 'Катафракту' : 'Спектру'}`, 'fail');
    Actions.hurtSheet(Tandem.pilot, mech ? 'm' : 'p');
    setTimeout(()=>{ const i = document.querySelector('.kv-sheet [name="dmg"]'); if(i){ i.value = m.amount; } if(m.pierce){ const c = document.querySelector('.kv-sheet [data-chip="pierce"]'); if(c) c.classList.add('on'); } }, 30);
  }
  return {request, hurt};
})();

    UI.sheet({title:'Запросить бросок', sub:one ? (one.pilot && one.pilot.name) || one.name : `всем игрокам (${ids.length})`, html:`
      <div class="kv-chips2" data-chips="one">${KAVA.STATS.map((s, i)=>UI.chip('check:' + s.key, 'Проверка ' + s.short, i===0)).join('')}${UI.chip('luck', 'Испытание Удачи')}${UI.chip('sensors', 'Сенсоры')}${UI.chip('alien', 'Отчуждённость')}${UI.chip('connect', 'Подключение')}${UI.chip('backlash', 'Отдача')}${UI.chip('init', 'Инициатива к6')}</div>
      <div class="kv-sheet-grid">${UI.stepper('dc', 13, 1, 40, 'Сложность')}<div class="kv-chips2" data-chips="mode">${UI.chip('adv', 'Преимущество')}${UI.chip('dis', 'Препятствие')}</div></div>
      <label class="kv-stepper kv-wide"><span>Пояснение игроку (необязательно)</span><input name="note" placeholder="Например: удержаться на обломке"></label>
      <div class="kv-sheet-btns"><button type="button" class="kv-btn kv-primary kv-grow2" data-a="send" autofocus>Отправить</button></div>`,
      onAction(a, btn, close, panel){
        const k = panel.querySelector('[data-chips="one"] .on').dataset.chip.split(':'), modes = [...panel.querySelectorAll('[data-chips="mode"] .on')].map(c=>c.dataset.chip);
        const msg = {type:'request', rid:Date.now().toString(36), kind:k[0], stat:k[1] || '', dc:UI.num(panel, 'dc', 13), mode:modes.length===1 ? modes[0] : 'norm', note:panel.querySelector('[name=note]').value.trim()};
        ids.forEach(id=>Table.send(Object.assign({}, msg), id));
        close(); UI.toast(`Запрос отправлен: ${ids.length===1 ? '1 игроку' : ids.length + ' игрокам'}`, 'ok');
      }});
    // выбор режима — независимые чипы, но взаимоисключающие
    setTimeout(()=>{ const g = document.querySelector('.kv-sheet [data-chips="mode"]'); if(g) g.addEventListener('click', (e)=>{ const c = e.target.closest('[data-chip]'); if(c) g.querySelectorAll('[data-chip]').forEach(x=>{ if(x!==c) x.classList.remove('on'); }); }); }, 0);
  }
  function hurtSheet(id){
    const x = Table.S.peers[id] || {};
    UI.sheet({title:'Нанести урон', sub:(x.pilot && x.pilot.name) || x.name, html:`
      <div class="kv-chips2" data-chips="one">${UI.chip('p', 'Спектру', !(x.pilot && x.pilot.inWomb))}${UI.chip('m', 'Катафракту', !!(x.pilot && x.pilot.inWomb))}</div>
      <div class="kv-sheet-grid">${UI.stepper('amount', 1, 0, 200, 'Урон')}</div><div class="kv-chips2">${UI.chip('pierce', 'Бронебойное')}</div>
      <p class="kv-note">Игрок получит окно урона с этим числом: бросит броню (расходник или кВ) и применит урон сам.</p>
      <div class="kv-sheet-btns"><button type="button" class="kv-btn kv-primary kv-grow2" data-a="send">Отправить</button></div>`,
      onAction(a, btn, close, panel){ Table.send({type:'hurt', side:panel.querySelector('[data-chips="one"] .on').dataset.chip, amount:UI.num(panel, 'amount', 1), pierce:UI.chipOn(panel, 'pierce')}, id); close(); UI.toast('Урон отправлен', 'ok'); }});
  }
  function sheetView(id){
    const x = Table.S.peers[id]; if(!x || !x.pilot) return;
    const p = Pilot.fix(JSON.parse(JSON.stringify(x.pilot))), m = p.mech;
    const li = (arr, f)=>arr.length ? `<ul class="kv-list2">${arr.map(f).join('')}</ul>` : '<div class="kv-empty">—</div>';
    UI.sheet({title:p.name || 'Спектр', sub:[p.culture.split(':')[0], m.name].filter(Boolean).join(' · '), html:`
      <div class="kv-fe kv-wide"><span>Оружие Спектра</span>${li(Pilot.weapons(p), w=>`<li>${esc(w.name)} — ${esc(w.dmg)} ${esc(w.range || '')} ${esc(w.tags || '')}</li>`)}</div>
      <div class="kv-fe kv-wide"><span>Снаряжение</span>${li(p.items.filter(i=>i.kind!=='weapon'), i=>`<li>${esc(i.name)} (${int(i.sl)} СЛ, метки ${int(i.marks)})</li>`)}</div>
      <div class="kv-fe kv-wide"><span>Травмы</span>${li(p.injuries, i=>`<li>${esc(i.text)}</li>`)}</div>
      <div class="kv-fe kv-wide"><span>Воспоминания</span>${li(p.memories, i=>`<li class="${i.lost ? 'kv-lost' : ''}">${esc(i.a || '—')}</li>`)}</div>
      <div class="kv-fe kv-wide"><span>Катафракт: вооружение и модули</span>${li(m.items, i=>`<li>${esc(i.name)}${i.dmg ? ' — ' + esc(i.dmg) : ''}${i.kind==='consumable' ? ` (метки ${int(i.marks)}/3)` : ''}${i.off ? ' · отключён' : ''}</li>`)}</div>
      <div class="kv-fe kv-wide"><span>Критические повреждения</span>${li(m.crits, i=>`<li>${esc(i.text)}</li>`)}</div>`});

  // ---------- Копьё ----------
  function lanceView(){
    const l = L(), r = l.res, perDay = Math.ceil(int(r.people) / 10);
    return `<div class="kv-gm-tools"><input class="kv-grow2" data-l="name" value="${esc(l.name)}" placeholder="Название Свободного Копья"><button type="button" class="kv-btn" data-g="lance-roll" title="6+2к6 Запасов, 6+2к6 Батарей, 6+3к6 Материалов, к6 Богатств, 40+2к6 Людей">⚄ Стартовые ресурсы</button></div>

        <div class="kv-row2"><select data-l="addunit" class="kv-grow2"><optgroup label="Свита">${RETINUE.map((u, i)=>`<option value="r${i}">${esc(u.name)} (СТК ${u.stk}, МОБ ${u.mob})</option>`).join('')}</optgroup><optgroup label="Техника">${TECH.map((u, i)=>`<option value="t${i}">${esc(u.name)} (СТК ${u.stk}, МОБ ${u.mob})</option>`).join('')}</optgroup></select><button type="button" class="kv-btn" data-g="unit-add">Добавить (СТК броском)</button></div></div>
      <label class="kv-fe kv-wide"><span>Заметки Копья: покровители, контракты, долги, Слава</span><textarea data-l="notes" rows="3">${esc(l.notes)}</textarea></label>`;
  }
  // ---------- броски Летописца ----------
  function rollsView(){
    return `<div class="kv-gm-tools"><label class="kv-chk"><input type="checkbox" data-g="secret"${secret ? ' checked' : ''}> Тайно — броски видите только вы</label></div>
      <div class="kv-act-grid">
        <button type="button" class="kv-act" data-g="r-reaction"><b>Реакция</b><span>2к6: враждебная … дружеская</span></button>
        <button type="button" class="kv-act" data-g="r-init"><b>Инициатива</b><span>к6 лидера стороны</span></button>
        <button type="button" class="kv-act" data-g="r-morale"><b>Боевой дух</b><span>2к6 против БД (по умолчанию 7)</span></button>
        <button type="button" class="kv-act" data-g="r-salvage"><b>Утилизация обломков</b><span>к6: Материалы и реликтовые детали</span></button>
        <button type="button" class="kv-act" data-g="r-salvage-m"><b>Утилизация Катафракта</b><span>2к6: что удалось снять</span></button>
        <button type="button" class="kv-act" data-g="r-wreck"><b>Оценка разрушений</b><span>2к6: можно ли восстановить</span></button>
        <button type="button" class="kv-act" data-g="r-crit"><b>Крит. травма</b><span>к20</span></button>
        <button type="button" class="kv-act" data-g="r-mcrit"><b>Крит. повреждение</b><span>к20</span></button>
        <button type="button" class="kv-act" data-g="r-tables"><b>Ещё броски</b><span>торги, шанс, свободный бросок</span></button>
      </div>
      <div class="kv-sec2"><h3>Генераторы Летописца</h3><div class="kv-act-grid">
        <button type="button" class="kv-act" data-g="lore-seed"><b>Завязка приключения</b><span>тип, причина, действующие лица, амплуа, Катафракты, провал, награда</span></button>
        <button type="button" class="kv-act" data-g="lore-system"><b>Звёздная система</b><span>звезда, удалённость, маршруты, объекты и планеты</span></button>
        <button type="button" class="kv-act" data-g="lore-relic-r"><b>Реликтовое оружие</b><span>стрелковое, с прихотью</span></button>
        <button type="button" class="kv-act" data-g="lore-relic-m"><b>Реликтовое оружие</b><span>ближнего боя, с прихотью</span></button></div>
        <div class="kv-chips2" style="margin-top:8px">${Object.keys(LORE.SEEDS).map(k=>`<button type="button" class="kv-chip" data-g="lore-t" data-k="${k}">${esc(LORE.SEEDS[k].name)}</button>`).join('')}</div></div>`;
  }
  const SALVAGE = ['Ничего ценного, только ржавчина и лом.', 'к3 Мат.', 'к6 Мат.', '2к6 Мат.', 'к3 Реликтовых деталей.', 'к3 Реликтовые детали + к6 Мат.'];
  const SALVAGE_M = {2:'Ничего ценного, только ржавчина и лом.', 3:'Утроба.', 4:'Брось дважды.', 5:'Каркас.', 6:'Вооружение.', 7:'Модуль.', 8:'6 Мат.', 9:'Сенсоры.', 10:'к3 Реликтовых деталей.', 11:'Реактор.', 12:'Ядро.'};
  const WRECK = {2:'Критические компоненты не пострадали.', 3:'Будет много кропотливой работы. Время × 1,5.', 4:'Брось дважды с +1.', 5:'Утроба уничтожена.', 6:'Реактор полностью испарился.', 7:'Каркас не восстановить.', 8:'Сенсоры разорвало на куски.', 9:'Ядро — обломки, которые не собрать.', 10:'Сложный случай. Мат × 1,5.', 11:'Нужна редкая реликтовая деталь.', 12:'Понадобится 2к6 Реликтовых деталей.'};
  function tableRoll(title, sides, n, map){
    const ds = []; for(let i = 0; i < n; i++) ds.push(Dice.rnd(sides));
    const v = ds.reduce((a, b)=>a + b, 0), text = typeof map==='function' ? map(v) : map[v];
    return Rolls.push({who:'Летописец', kind:'gm', title, tone:'info', big:v, verdict:text, lines:[`${n > 1 ? n : ''}к${sides}: [${ds.join(', ')}] = ${v}`], dice:ds.map(x=>({sides, value:x}))});
  }

  function render(){
    if(!root) return;
    root.innerHTML = `<div class="kv-gm"><div class="kv-gm-tabs kv-seg">${[['battle', 'Бой'], ['tandems', 'Тандемы'], ['lance', 'Копьё'], ['rolls', 'Броски']].map(([k, n])=>`<button type="button" data-gtab="${k}" class="${tab===k ? 'on' : ''}">${n}</button>`).join('')}</div>
      <div class="kv-gm-body">${tab==='battle' ? '<div data-battle-root></div>' : tab==='tandems' ? tandems() : tab==='lance' ? lanceView() : rollsView()}</div></div>`;
    const br = root.querySelector('[data-battle-root]'); if(br) Battle.mount(br);
  }
  function onClick(e){
    const t = e.target.closest('[data-gtab]'); if(t){ tab = t.dataset.gtab; render(); return; }
    const b = e.target.closest('[data-g]'); if(!b) return;
    const a = b.dataset.g, id = b.dataset.id, l = L();
    switch(a){
      case 'ask': askSheet([id]); return;
      case 'ask-all': askSheet(players().map(([pid])=>pid)); return;
      case 'adv': case 'dis': Table.send({type:'mods', mode:a}, id); UI.toast(a==='adv' ? 'Преимущество на следующий бросок' : 'Препятствие на следующий бросок', 'ok'); return;
      case 'hurt': hurtSheet(id); return;
      case 'sheet': sheetView(id); return;
      case 'link': TableUI.sheet(); return;
      case 'secret': secret = b.checked; return;
      case 'res': l.res[b.dataset.k] = Math.max(0, int(l.res[b.dataset.k]) + int(b.dataset.d)); saveLance(l); render(); return;
      case 'day': { const n = Math.ceil(int(l.res.people) / 10); l.res.supplies = Math.max(0, int(l.res.supplies) - n); saveLance(l); render(); UI.toast(`Сутки: −${n} Запасов${int(l.res.supplies)===0 ? '. Запасы кончились!' : ''}`, int(l.res.supplies) ? 'ok' : 'fail'); return; }
      case 'lance-roll': {
        const r = (s)=>Dice.roll(s), s = r('6+2к6'), bt = r('6+2к6'), mt = r('6+3к6'), w = r('к6'), pp = r('40+2к6');
        Object.assign(l.res, {supplies:s.total, batteries:bt.total, materials:mt.total, wealth:w.total, people:pp.total});
        if(!l.units.length) [RETINUE[0], RETINUE[0], TECH[0]].forEach(u=>l.units.push(unitFrom(u)));
        saveLance(l); render();
        roll(Rolls.push({who:'Летописец', kind:'gm', title:'Стартовые ресурсы Копья', tone:'info', big:'', verdict:`Запасы ${s.total} · Батареи ${bt.total} · Материалы ${mt.total} · Богатства ${w.total} · Люди ${pp.total}`, lines:[s.text, bt.text, mt.text, w.text, pp.text]})); return; }
      case 'unit-add': { const v = root.querySelector('[data-l="addunit"]').value, u = (v[0]==='r' ? RETINUE : TECH)[+v.slice(1)]; l.units.push(unitFrom(u)); saveLance(l); render(); return; }
      case 'unit-del': l.units = l.units.filter(u=>u.id!==id); saveLance(l); render(); return;
      case 'r-reaction': roll(Rolls.reaction(0)); return;
      case 'r-init': roll(Rolls.initiative('Летописец')); return;
      case 'r-morale': roll(Rolls.morale(7)); return;
      case 'r-salvage': roll(tableRoll('Утилизация обломков', 6, 1, (v)=>SALVAGE[v - 1])); return;
      case 'r-salvage-m': roll(tableRoll('Утилизация Катафракта', 6, 2, SALVAGE_M)); return;
      case 'r-wreck': roll(tableRoll('Оценка разрушений', 6, 2, WRECK)); return;
      case 'r-crit': { const v = Dice.rnd(20); roll(Rolls.push({who:'Летописец', kind:'gm', title:'Критическая травма', tone:'crit', big:v, verdict:KAVA.CRIT_INJURIES[v - 1], lines:[], dice:[{sides:20, value:v, tint:'bad'}]})); return; }
      case 'r-mcrit': { const v = Dice.rnd(20); roll(Rolls.push({who:'Летописец', kind:'gm', title:'Критическое повреждение', tone:'crit', big:v, verdict:MECH.CRITS[v - 1], lines:[], dice:[{sides:20, value:v, tint:'bad'}]})); return; }
      case 'r-tables': Actions.tablesSheet(Tandem.pilot); return;
      case 'lore-seed': case 'lore-system': case 'lore-relic-r': case 'lore-relic-m': case 'lore-t': {
        const x = a==='lore-seed' ? LORE.seed() : a==='lore-system' ? LORE.system() : a==='lore-t' ? LORE.table(b.dataset.k) : LORE.relic(a==='lore-relic-m' ? 'melee' : 'ranged');
        roll(Rolls.push({who:'Летописец', kind:'lore', title:x.title, tone:'info', big:x.big, verdict:x.verdict, lines:x.lines, dice:x.dice})); return; }
    }
  }
  function unitFrom(u){ const r = Dice.roll(u.stk); return {id:Pilot.uid(), name:u.name, stk:r ? r.total : 0, mob:u.mob, note:u.note}; }
  function onInput(e){
    const l = L(), el = e.target;
    if(el.dataset.r){ l.res[el.dataset.r] = Math.max(0, int(el.value)); saveLance(l); return; }
    if(el.dataset.l==='name' || el.dataset.l==='notes'){ l[el.dataset.l] = el.value; clearTimeout(onInput.t); onInput.t = setTimeout(()=>saveLance(l), 600); return; }
    if(el.dataset.u){ const u = l.units.find(x=>x.id===el.dataset.u); if(u){ u[el.dataset.uf] = el.type==='number' ? int(el.value) : el.value; clearTimeout(onInput.t); onInput.t = setTimeout(()=>saveLance(l), 600); } }
  }
  function mount(el){ root = el; root.addEventListener('click', onClick); root.addEventListener('input', onInput); Table.onChange(()=>{ lance = null; if(document.body.classList.contains('gm-view') && tab!=='battle' && !root.contains(document.activeElement)) render(); }); render(); }
  return {mount, render};
})();
/* ======================================================================
   КАВАЛЕРИЯ — БОЙ НА СХЕМЕ ЗОН (часть 2 книги). Поле боя — Зоны; дистанции абстрактные: в одной Зоне — ближняя (>)
   или контактная (⁕, вплотную), между Зонами — средняя (>>), до Зон на краю поля (отмечены «дальняя») — дальняя (>>>).
   Укрытие в Зоне — +3 МОБ против дальнобойных атак. Стороны: Копьё (тандемы игроков, союзники) и Враги. Каждый раунд
   лидеры сторон бросают к6 — от большего к меньшему, при ничьей одновременно; застигнутая врасплох сторона пропускает
   первый раунд. Боевой Дух: 2к6 больше БД — отступает; после двух удачных проверок — до конца. Поводы для проверки
   (подсказка «БД!» сама): потеря половины СТК, критическое повреждение, гибель лидера или половины группы.
   Состояние боя ведёт Летописец (reincarnator_kava_battle_v1 по коду стола) и рассылает всем (battle). Игроки
   двигают свой жетон (battle-move) и сообщают о попадании по врагу (battle-hit) — Летописец применяет: броня врага,
   «игнорирует урон меньше 5», «4+ на броне — попадание игнорируется».
   ====================================================================== */
const Battle = (function(){
  const KEY = 'reincarnator_kava_battle_v1', esc = kvEsc, int = (v, d)=>Pilot.int(v, d);
  const SIDES = {lance:'Копьё', enemy:'Враги'};
  let B = null, roots = [], sendTimer = 0;
  const isGm = ()=>Table.S.role==='gm';
  const uid = ()=>Pilot.uid();
  function blank(){ return {active:true, round:0, surprise:'', order:[], showMob:true, zones:[{id:uid(), name:'Зона 1', far:false, cover:false, smoke:false, rough:false}], units:[]}; }
  // ---- хранение и рассылка (Летописец) ----
  function key(){ return Table.S.code || 'solo'; }
  function load(){ let all = {}; try{ all = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){} return all[key()] || null; }
  function persist(){ let all = {}; try{ all = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){} all[key()] = B; try{ localStorage.setItem(KEY, JSON.stringify(all)); }catch(e){} }
  function changed(){
    if(isGm() || !Table.S.role){ persist(); clearTimeout(sendTimer); sendTimer = setTimeout(()=>{ if(isGm()) Table.send({type:'battle', state:wire()}); }, 250); }
    renderAll();
    if(typeof App!=='undefined') App.battleChanged();
  }
  // что уходит игрокам: тандемы — с текущими значениями; враги — без чисел, если Летописец их скрыл
  function wire(){
    if(!B) return null;
    const s = JSON.parse(JSON.stringify(B));
    s.units.forEach(u=>{ const v = view(u); u.view = {name:v.name, stk:v.stk, stkMax:v.stkMax, mob:v.mob, scale:v.scale};
      if(u.side==='enemy' && !B.showMob){ u.view.mob = null; u.view.stk = null; u.hp = v.stkMax ? Math.round(v.stk / v.stkMax * 100) : 100; u.mob = null; u.stk = null; u.bd = null; } });
    return s;
  }
  // ---- значения жетона: тандем берёт данные из листа игрока (или своего) ----
  function tandemOf(u){
    if(u.self) return Tandem.pilot;
    if(isGm()){ const x = Table.S.peers[u.peer]; return x && x.pilot ? Pilot.fix(JSON.parse(JSON.stringify(x.pilot))) : null; }
    if(u.peer && u.peer===Table.S.myId) return Tandem.pilot;
    return null;
  }
  function view(u){
    if(u.kind==='tandem'){
      const p = tandemOf(u);
      if(!p) return u.view || {name:u.name, stk:0, stkMax:0, mob:10, scale:'personal'};

        : {name:p.name || u.name, stk:int(p.stk), stkMax:Pilot.stkMax(p), mob:Pilot.mob(p).total, scale:'personal', womb:false, p};
    }
    if(u.view && !isGm()) return Object.assign({}, u.view, {name:u.name});
    return {name:u.name, stk:int(u.stk), stkMax:int(u.stkMax), mob:u.mob, scale:u.scale || 'strategic'};
  }
  const zoneOf = (u)=>B.zones.find(z=>z.id===u.zone) || null;
  // дистанция между жетонами
  function distance(a, b){
    const za = zoneOf(a), zb = zoneOf(b);
    if(!za || !zb) return '>>';
    if(za.id===zb.id) return '>';
    return za.far || zb.far ? '>>>' : '>>';
  }
  const RANK = {'⁕':0, '>':1, '>>':2, '>>>':3};
  const DIST_NAME = {'⁕':'контактная', '>':'ближняя', '>>':'средняя', '>>>':'дальняя'};

  // ---- действия Летописца ----
  function start(){ B = load() || blank(); B.active = true; if(!B.zones.length) B.zones.push({id:uid(), name:'Зона 1'}); changed(); }
  function end(){ if(!B) return; B.active = false; changed(); Table.send({type:'battle', state:{active:false}}); }
  function addZone(){ B.zones.push({id:uid(), name:'Зона ' + (B.zones.length + 1), far:false, cover:false, smoke:false, rough:false}); changed(); }
  function addEnemy(e, count, zone, custom){
    const n = Math.max(1, Math.min(30, int(count, 1))), group = n > 1 ? uid() : '';
    for(let i = 0; i < n; i++){
      const r = Dice.roll(e.stk) || {total:int(e.stk, 6)};
      B.units.push({id:uid(), side:'enemy', kind:'enemy', ekey:e.key || '', name:e.name + (n > 1 ? ' ' + (i + 1) : ''), zone:zone || B.zones[0].id, stk:r.total, stkMax:r.total, mob:int(e.mob, 13),
        bd:int(e.bd, 7), atk:int(e.atk), weapons:JSON.parse(JSON.stringify(e.weapons || [{name:'Оружие', dmg:'к6'}])), armor:e.armor || '', marks:0, scale:e.scale || 'strategic',
        feats:(e.feats || []).slice(), ignoreBelow:e.ignoreBelow || 0, ignore4:!!e.ignore4, group, groupSize:n, leader:false, acted:false, status:'ok', moraleOk:0, moraleDue:'', custom:!!custom});
    }

  }
  function addTandems(){
    Object.entries(Table.S.peers).forEach(([id, x])=>{
      if(x.role!=='player' || B.units.some(u=>u.kind==='tandem' && u.peer===id)) return;
      B.units.push({id:uid(), side:'lance', kind:'tandem', peer:id, name:(x.pilot && x.pilot.name) || x.name || 'Спектр', zone:B.zones[0].id, acted:false, status:'ok'});
    });
    if(!Table.S.role && !B.units.some(u=>u.self)) B.units.push({id:uid(), side:'lance', kind:'tandem', self:true, name:(Tandem.pilot && Tandem.pilot.name) || 'Спектр', zone:B.zones[0].id, acted:false, status:'ok'});
    changed();
  }
  function addAlly(t){ const r = Dice.roll(t.stk) || {total:int(t.stk, 6)}; B.units.push({id:uid(), side:'lance', kind:'ally', name:t.name, zone:B.zones[0].id, stk:r.total, stkMax:r.total, mob:int(t.mob, 13), bd:7, atk:0, weapons:[{name:'Оружие', dmg:'к6'}], scale:'personal', acted:false, status:'ok', moraleOk:0, moraleDue:''}); changed(); }
  function newRound(){
    B.round = int(B.round) + 1;
    const ds = [], order = [];
    Object.keys(SIDES).forEach(s=>{
      if(!B.units.some(u=>u.side===s && u.status!=='dead')) return;
      if(B.round===1 && B.surprise===s){ order.push({side:s, roll:0, skip:true}); return; }
      const v = Dice.rnd(6); ds.push({sides:6, value:v, label:SIDES[s]}); order.push({side:s, roll:v});
    });
    order.sort((a, b)=>b.roll - a.roll);
    B.order = order; B.units.forEach(u=>{ u.acted = false; });
    const text = order.map(o=>o.skip ? `${SIDES[o.side]} — застигнуты врасплох, пропускают раунд` : `${SIDES[o.side]} ${o.roll}`).join(' · ');
    const tie = order.length > 1 && !order[0].skip && order[1] && order[0].roll===order[1].roll;
    changed();
    return Rolls.push({who:'Летописец', kind:'init', title:`Раунд ${B.round}: инициатива`, tone:'info', big:B.round, verdict:text + (tie ? ' — ничья: одновременно' : ''), lines:['Лидеры сторон бросают к6; внутри стороны первыми действуют те, у кого выше МОБ.'], dice:ds});
  }
  // урон по жетону врага/союзника (Летописец): броня, особенности, Боевой Дух
  function applyHit(id, dmg, o){
    o = o || {}; const u = B.units.find(x=>x.id===id); if(!u || u.kind==='tandem') return null;
    dmg = Math.max(0, int(dmg)); const lines = [`${o.from ? o.from + ': ' : ''}урон ${dmg}${o.pierce ? ' (бронебойное)' : ''}`], dice = [];
    let taken = dmg;
    if(u.ignore4 && int(u.marks) < 3){ const v = Dice.rnd(6); dice.push({sides:6, value:v, label:'броня'}); if(v >= 4){ u.marks = int(u.marks) + 1; taken = 0; lines.push(`Архаическая броня: к6 [${v}] — попадание проигнорировано (метка ${u.marks}/3)`); } else lines.push(`Архаическая броня: к6 [${v}] — не сработала`); }
    if(taken && u.armor){ const a = Dice.roll(u.armor); if(a){ const block = o.pierce ? Math.floor(a.total / 2) : a.total; taken = Math.max(0, taken - block); lines.push(`Броня ${u.armor}: ${a.total}${o.pierce ? ' → половина ' + block : ''}`); a.dice.forEach(v=>dice.push({sides:a.max, value:v, label:'броня'})); } }
    if(taken && u.ignoreBelow && taken < u.ignoreBelow){ lines.push(`Повреждение меньше ${u.ignoreBelow} — игнорируется`); taken = 0; }
    const before = int(u.stk); u.stk = Math.max(0, before - taken); lines.push(`СТК ${before} → ${u.stk}`);
    if(before > u.stkMax / 2 && u.stk <= u.stkMax / 2 && u.stk > 0) due(u, 'потеря половины СТК');
    if(o.crit) due(u, 'критическое повреждение');
    if(u.stk <= 0 && before > 0) killed(u, lines);
    changed();
    return Rolls.push({who:'Летописец', kind:'bhit', title:`Попадание: ${u.name}`, tone:u.stk <= 0 ? 'crit' : taken ? 'fail' : 'ok', big:taken ? '−' + taken : '0', verdict:u.stk <= 0 ? 'Выведен из боя' : `СТК ${u.stk} из ${u.stkMax}`, lines, dice});
  }
  const due = (u, why)=>{ if(u.status==='ok' && int(u.moraleOk) < 2 && u.bd) u.moraleDue = why; };
  function killed(u, lines){
    u.status = 'dead'; u.moraleDue = '';
    lines.push(`${u.name} выведен из боя.`);
    if(u.group){
      const g = B.units.filter(x=>x.group===u.group), alive = g.filter(x=>x.status!=='dead');
      if(u.leader){ alive.forEach(x=>due(x, 'гибель лидера')); lines.push('Погиб лидер группы — проверка Боевого Духа.'); }
      else if(alive.length <= Math.floor(u.groupSize / 2) && !g.halfDone){ alive.forEach(x=>due(x, 'потеря половины группы')); lines.push('Группа потеряла половину — проверка Боевого Духа.'); }
      if(u.ekey==='vpered') alive.forEach(x=>{ x.mob = int(x.mob) - 1; });
    }
  }
  function morale(id){
    const u = B.units.find(x=>x.id===id); if(!u) return null;
    const r = Dice.roll('2к6'), fail = r.total > int(u.bd, 7);
    if(fail){ u.status = 'retreat'; u.moraleDue = ''; } else { u.moraleOk = int(u.moraleOk) + 1; u.moraleDue = ''; }
    changed();
    return Rolls.push({who:'Летописец', kind:'morale', title:`Боевой Дух: ${u.name}`, tone:fail ? 'fail' : 'ok', big:r.total, verdict:fail ? 'Провал — отступает' : int(u.moraleOk) >= 2 ? 'Держится — теперь бьётся до конца' : 'Держится',
      lines:[`${r.text} против БД ${u.bd}`], dice:r.dice.map(v=>({sides:6, value:v}))});
  }
  // атака жетона (враг/союзник) по цели: тандем игрока — ему уходит окно урона; другой жетон — урон сразу
  function unitAttack(id, wi, targetId, mode, extra){
    const u = B.units.find(x=>x.id===id), t = B.units.find(x=>x.id===targetId); if(!u || !t) return null;
    const w = (u.weapons || [])[wi] || {name:'Оружие', dmg:'к6'}, tv = view(t), zt = zoneOf(t), dist = distance(u, t);
    // оружие ближнего боя достаёт только в своей Зоне
    if((w.melee || /клинок|фальшион|тесак|молот|кулак|мацак/i.test(w.name)) && dist!=='>'){
      UI.toast(`${w.name}: цель в другой Зоне — ближним боем не достать`, 'fail'); return null; }
    let mob = int(tv.mob, 10); const lines = [];
    if(zt && zt.cover && !w.melee && dist!=='>'){ mob += 3; lines.push('Цель в укрытии: +3 МОБ против дальнобойной атаки'); }
    const r = Dice.check(int(u.atk) + int(extra), mob, mode || 'norm');
    lines.unshift(`${u.name} — ${w.name}: к20${r.rolls.length > 1 ? ` [${r.rolls.join(', ')}] → ${r.nat}` : ` [${r.nat}]`} + ${int(u.atk) + int(extra)} = ${r.total} против МОБ ${mob} (${tv.name}, дистанция ${DIST_NAME[dist]})`);
    const dice = r.rolls.map(v=>({sides:20, value:v, label:'атака', tint:v===r.nat ? (r.auto==='success' ? 'good' : r.auto==='fail' ? 'bad' : '') : '', dim:r.rolls.length > 1 && v!==r.nat}));
    let dmg = 0;
    if(r.ok){
      const d = Dice.roll(w.dmg || 'к6') || {total:0, dice:[], text:'—'}; dmg = d.total; lines.push('Вред ' + d.text); d.dice.slice(0, 4).forEach(v=>dice.push({sides:d.max || 6, value:v, label:'вред'}));
      if(u.scale==='strategic' && tv.scale==='personal'){ dmg *= 10; lines.push(`Техника по цели персонального масштаба: × 10 = ${dmg}`); }
      if(r.auto==='success') lines.push('20 — цель получает Критическую травму (Критическое повреждение)');
    }
    u.acted = true; changed();
    const e = Rolls.push({who:'Летописец', kind:'battack', title:`${u.name} атакует: ${tv.name}`, tone:r.ok ? (r.auto==='success' ? 'crit' : 'fail') : 'ok', big:r.ok ? dmg : r.total,
      verdict:r.ok ? `Попадание: ${dmg} урона` : 'Промах', lines, dice, fx:r.auto==='success' ? {nat20:true} : r.auto==='fail' ? {nat1:true} : null});
    if(r.ok && dmg){
      if(t.kind==='tandem' && t.peer) Table.send({type:'hurt', side:tv.womb ? 'm' : 'p', amount:dmg, pierce:!!/бронебойн/i.test(w.name + (w.tags || ''))}, t.peer);

    }
    return e;
  }
  // ---- сообщения стола ----

  // цели для карточки атаки игрока: враги с дистанцией от моего жетона

  // ---------- карточки жетонов ----------

/* ======================================================================
   КАВАЛЕРИЯ — ЭПИЧНЫЕ СЦЕНЫ на весь экран (у всех за столом): натуральная 20 — золотые лучи и вспышка числа,
   натуральная 1 — число трескается и разваливается, взрыв реактора — белая вспышка и ударная волна,
   неконтролируемый коллапс (Отдача 12+) — глитч сознания. Поверх 3D-костей, перед карточкой итога.
   Выключаются в меню («Эпичные сцены», reincarnator_kava_app_v1.epic) и при «уменьшении движения» в системе.
   ====================================================================== */
const Epic = (function(){
  const esc = kvEsc;
  const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const on = ()=>!reduce && App.pref('epic')!==false;
  const kindOf = (e)=>{ const f = e && e.fx; if(!f) return ''; return f.boom ? 'boom' : f.collapse ? 'collapse' : f.nat20 ? 'nat20' : f.nat1 ? 'nat1' : ''; };
  const CAP = {nat20:'Критический успех', nat1:'Провал', boom:'Взрыв реактора', collapse:'Неконтролируемый коллапс'};
  const NUM = {nat20:'20', nat1:'1', boom:'', collapse:'КОЛЛАПС'};
  const MS = {nat20:2300, nat1:2100, boom:2600, collapse:2600};
  function play(e){
    const k = kindOf(e);
    if(!k || !on()) return Promise.resolve(false);
    document.querySelectorAll('.kv-epic').forEach(x=>x.remove());
    const el = document.createElement('div');
    el.className = 'kv-epic ep-' + k; el.setAttribute('aria-hidden', 'true');
    let sparks = ''; if(k==='nat20' || k==='boom') for(let i = 0; i < 18; i++){ const a = Math.random() * 360, d = 30 + Math.random() * 45; sparks += `<i style="--a:${a.toFixed(0)}deg;--d:${d.toFixed(0)}vmin;--t:${(0.6 + Math.random() * 0.8).toFixed(2)}s;--s:${(0.1 + Math.random() * 0.3).toFixed(2)}s"></i>`; }
    el.innerHTML = `<div class="ep-bg"></div>${k==='nat20' ? '<div class="ep-rays"></div>' : ''}${k==='boom' ? '<div class="ep-flash"></div><div class="ep-ring"></div><div class="ep-ring r2"></div><div class="ep-fire"></div>' : ''}
      ${k==='collapse' ? '<div class="ep-scan"></div>' : ''}${sparks ? `<div class="ep-sparks">${sparks}</div>` : ''}
      ${NUM[k] ? `<div class="ep-num" data-t="${esc(NUM[k])}">${k==='nat1' ? '<span class="h1">1</span><span class="h2">1</span>' : esc(NUM[k])}</div>` : ''}
      <div class="ep-cap"><b>${CAP[k]}</b><span>${esc((e.who ? e.who + ' · ' : '') + (e.title || ''))}</span></div>`;
    document.body.appendChild(el);
    if(k==='nat1' || k==='boom' || k==='collapse'){ document.body.classList.remove('ep-shake'); void document.body.offsetWidth; document.body.classList.add('ep-shake'); }
    return new Promise(res=>{
      const done = ()=>{ el.classList.add('out'); setTimeout(()=>{ el.remove(); document.body.classList.remove('ep-shake'); res(true); }, 300); };
      const t = setTimeout(done, MS[k]); el.addEventListener('click', ()=>{ clearTimeout(t); done(); }, {once:true});
    });
  }
  return {play, kindOf};
})();
/* ======================================================================
   КАВАЛЕРИЯ — ПОГРУЖЕНИЕ В ЯДРО (часть 8). Первое погружение — кС трижды: Узел, его детали, событие; дальше каждый
   новый Узел — кС + Измерение по тем же таблицам. Узел Перехода (и разрывы «Измерение +к4») ведут глубже. Ветка
   «Внутри…» бросается при открытии Узла (кС или к6 — как в книге). События с формулой Даров дают бросок по Таблице
   Даров (к100, итог больше 99 — 99); Дары копятся в Катафракте, повторные складываются. Выход — к20 + ЭМП против
   Отчуждённости + Измерение: провал — выход с Отдачей; любой выход сбрасывает кС до к6. Карта Узлов сохраняется

const Dive = (function(){

  const ks = (p)=>Dice.rnd(+p.ks || 6);
